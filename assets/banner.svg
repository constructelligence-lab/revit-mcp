<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="revit-mcp — Autodesk Revit to any MCP client">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#16324a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <!-- the roof glyph, same mark as the product -->
  <g transform="translate(72,86)" stroke="#7fb2ff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 44 L55 11 L88 44"/>
    <path d="M33 66 L55 44 L77 66"/>
  </g>
  <text x="200" y="150" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="700" fill="#ffffff">revit-mcp</text>
  <text x="202" y="196" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="24" fill="#9fb6cd">Autodesk Revit to any MCP client — read live, write one parameter, undo with Ctrl+Z</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#6f8ba8">
    <text x="202" y="252">revit_status · model_overview · query_elements · model_warnings · read_schedule · set_parameter</text>
  </g>
  <rect x="72" y="252" width="96" height="34" rx="17" fill="none" stroke="#3d6b9c"/>
  <text x="90" y="275" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#9fc3ea">read-only</text>
</svg>
