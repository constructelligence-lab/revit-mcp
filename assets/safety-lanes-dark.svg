<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d"><title id="t">What revit-mcp can and cannot do to your model</title><desc id="d">Reads always work. Renders and exports use a temporary view that is rolled back. Writes need two switches, a preview, an explicit apply and one undoable transaction.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1c1e"/><stop offset="1" stop-color="#000000"/></linearGradient><filter id="sh" x="-8%" y="-8%" width="116%" height="128%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000" flood-opacity="0.5"/></filter></defs><rect width="1200" height="520" rx="28" fill="url(#bg)"/><rect x=".5" y=".5" width="1199" height="519" rx="28" fill="none" stroke="#3a3a3c"/><text x="56" y="84" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="38" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.6">Read-only until you say otherwise</text><text x="56" y="118" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="17" font-weight="400" fill="#a1a1a6" text-anchor="start">Three kinds of request, three levels of care.</text><rect x="56" y="150" width="1088" height="96" rx="22" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1" filter="url(#sh)"/><rect x="56" y="168" width="5" height="60" rx="2.5" fill="#30d158"/><text x="84" y="190" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="20" font-weight="700" fill="#f5f5f7" text-anchor="start">Read</text><text x="84" y="214" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#a1a1a6" text-anchor="start">Always available</text><rect x="330" y="180.0" width="54.57" height="36" rx="18" fill="#38383a"/><text x="357.285" y="203.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">Ask</text><line x1="390.57" y1="198.0" x2="409.07" y2="198.0" stroke="#636366" stroke-width="2" stroke-linecap="round"/><path d="M405.3 200.9 L410.57 198.0 L405.3 195.1" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="416.57" y="180.0" width="251.13" height="36" rx="18" fill="#30d158" opacity="0.22"/><text x="542.135" y="203.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">Live read of the open model</text><line x1="673.7" y1="198.0" x2="692.2" y2="198.0" stroke="#636366" stroke-width="2" stroke-linecap="round"/><path d="M688.4 200.9 L693.7 198.0 L688.4 195.1" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="699.7" y="180.0" width="79.14" height="36" rx="18" fill="#38383a"/><text x="739.2700000000001" y="203.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">Answer</text><rect x="56" y="262" width="1088" height="96" rx="22" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1" filter="url(#sh)"/><rect x="56" y="280" width="5" height="60" rx="2.5" fill="#0a84ff"/><text x="84" y="302" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="20" font-weight="700" fill="#f5f5f7" text-anchor="start">Render and export</text><text x="84" y="326" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#a1a1a6" text-anchor="start">Never changes the model</text><rect x="330" y="292.0" width="54.57" height="36" rx="18" fill="#38383a"/><text x="357.285" y="315.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">Ask</text><line x1="390.57" y1="310.0" x2="409.07" y2="310.0" stroke="#636366" stroke-width="2" stroke-linecap="round"/><path d="M405.3 312.9 L410.57 310.0 L405.3 307.1" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="416.57" y="292.0" width="169.23" height="36" rx="18" fill="#0a84ff" opacity="0.22"/><text x="501.185" y="315.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">Temporary 3D view</text><line x1="591.8" y1="310.0" x2="610.3" y2="310.0" stroke="#636366" stroke-width="2" stroke-linecap="round"/><path d="M606.5 312.9 L611.8 310.0 L606.5 307.1" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="617.8" y="292.0" width="136.47" height="36" rx="18" fill="#38383a"/><text x="686.035" y="315.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">Image or file</text><line x1="760.27" y1="310.0" x2="778.77" y2="310.0" stroke="#636366" stroke-width="2" stroke-linecap="round"/><path d="M775.0 312.9 L780.27 310.0 L775.0 307.1" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="786.27" y="292.0" width="161.04" height="36" rx="18" fill="#0a84ff" opacity="0.22"/><text x="866.79" y="315.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">View rolled back</text><rect x="56" y="374" width="1088" height="96" rx="22" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1" filter="url(#sh)"/><rect x="56" y="392" width="5" height="60" rx="2.5" fill="#ff9f0a"/><text x="84" y="414" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="20" font-weight="700" fill="#f5f5f7" text-anchor="start">Write</text><text x="84" y="438" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#a1a1a6" text-anchor="start">Two tools, both previewed</text><rect x="330" y="404.0" width="54.57" height="36" rx="18" fill="#38383a"/><text x="357.285" y="427.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">Ask</text><line x1="390.57" y1="422.0" x2="409.07" y2="422.0" stroke="#636366" stroke-width="2" stroke-linecap="round"/><path d="M405.3 424.9 L410.57 422.0 L405.3 419.1" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="416.57" y="404.0" width="161.04" height="36" rx="18" fill="#ff9f0a" opacity="0.22"/><text x="497.09" y="427.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">Both switches on</text><line x1="583.61" y1="422.0" x2="602.11" y2="422.0" stroke="#636366" stroke-width="2" stroke-linecap="round"/><path d="M598.3 424.9 L603.61 422.0 L598.3 419.1" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="609.61" y="404.0" width="87.33" height="36" rx="18" fill="#38383a"/><text x="653.275" y="427.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">Preview</text><line x1="702.94" y1="422.0" x2="721.44" y2="422.0" stroke="#636366" stroke-width="2" stroke-linecap="round"/><path d="M717.7 424.9 L722.94 422.0 L717.7 419.1" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="728.94" y="404.0" width="120.08999999999999" height="36" rx="18" fill="#ff9f0a" opacity="0.22"/><text x="788.985" y="427.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">apply: true</text><line x1="855.0300000000001" y1="422.0" x2="873.5300000000001" y2="422.0" stroke="#636366" stroke-width="2" stroke-linecap="round"/><path d="M869.8 424.9 L875.0300000000001 422.0 L869.8 419.1" fill="none" stroke="#636366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="881.0300000000001" y="404.0" width="251.13" height="36" rx="18" fill="#ff9f0a" opacity="0.22"/><text x="1006.595" y="427.0" font-family='-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle">One transaction, one Ctrl+Z</text></svg>
