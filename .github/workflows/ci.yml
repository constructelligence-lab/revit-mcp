name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: MCP server (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run check:docs
        working-directory: server
      - run: npm pack --dry-run
        working-directory: server

  addin:
    name: Add-in (Revit ${{ matrix.revit }})
    runs-on: ubuntu-latest
    strategy:
      # One release failing must not hide the others: the point of the matrix is to see all of them.
      fail-fast: false
      matrix:
        include:
          - revit: '2025'      # .NET 8
          - revit: '2026'      # .NET 8
          - revit: '2027'      # .NET 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release -p:RevitVersion=${{ matrix.revit }}
        working-directory: addin
      - name: Which binary was produced
        run: ls -la addin/bin/Release/*/ | head -20

  addin-net48:
    name: Add-in (Revit 2024, .NET Framework 4.8)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Restore and build must name the framework together: an implicit restore during `dotnet build`
      # does not see -p:TargetFramework, which is how this job failed its first run.
      - run: dotnet restore -p:RevitVersion=2024 -p:TargetFramework=net48
        working-directory: addin
      - run: dotnet build -c Release --no-restore -p:RevitVersion=2024 -p:TargetFramework=net48
        working-directory: addin
